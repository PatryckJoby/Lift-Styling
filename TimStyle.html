<!-- JOBY LIFT HERO BANNER HTML BLOCK -->
<div class="joby-banner-wrapper" style="box-sizing: border-box; font-family: 'Inter', sans-serif; background-color: #ffffff; border-radius: 24px; padding: 32px; position: relative; overflow: hidden; margin-bottom: 16px;">

    <!-- Premium Accent Band -->
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 6px; display: flex;">
        <div style="flex: 1; background-color: #21398a;"></div>
        <div style="flex: 1; background-color: #006bf5;"></div>
        <div style="flex: 1; background-color: #f05c22;"></div>
    </div>

    <!-- Layout Flex -->
    <div class="joby-banner-flex" style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 24px;">

        <!-- Welcome Message -->
        <div style="flex: 1;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;">
                <span style="background-color: #f05c22; color: #ffffff; padding: 3px 10px; border-radius: 9999px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em;">
                    Go Up with Lift
                </span>
                <span id="joby-time-greeting" style="color: #94a3b8; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;">
                    Welcome back
                </span>
            </div>
            <h1 style="color: #21398a; font-size: 38px; font-weight: 900; margin: 0 0 8px 0; letter-spacing: -0.05em; line-height: 0.95;">
                Take your skills higher.
            </h1>
            <p style="color: #64748b; font-size: 14px; font-weight: 500; margin: 0; line-height: 1.5;">
                Get certified. Stay compliant. Be Curious.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="button-deck" style="display: flex; flex-wrap: wrap; gap: 10px; align-self: stretch; justify-content: flex-start;">
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // --- Get time-based greeting ---
    var hour = new Date().getHours();
    var greeting = "Good morning";
    if (hour >= 12 && hour < 17) {
        greeting = "Good afternoon";
    } else if (hour >= 17) {
        greeting = "Good evening";
    }

    // --- Try to find the user's name from Totara's nav bar ---
    var firstName = "";
    var userMenu = document.querySelector(".usermenu .usertext")
                || document.querySelector(".userinitials + span")
                || document.querySelector('[data-region="user-menu"] .usertext')
                || document.querySelector(".login-info a")
                || document.querySelector(".userloggedinas a");

    if (userMenu) {
        var fullName = userMenu.textContent.trim();
        firstName = ", " + fullName.split(" ")[0];
    }

    // --- Update the greeting element ---
    var greetingElement = document.getElementById("joby-time-greeting");
    if (greetingElement) {
        greetingElement.innerText = greeting + firstName;
    }

});
</script>
